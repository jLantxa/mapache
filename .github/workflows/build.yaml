name: build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (tag, branch, or commit SHA)
        required: true
        type: string
      create_release:
        description: Create a GitHub Release
        required: false
        default: true
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_LTO: true
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
  MAPACHE_RELEASE_TYPE: release
  ZIG_VERSION: "0.16.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || inputs.ref }}
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.ref.outputs.value }}
      safe_ref: ${{ steps.ref.outputs.safe }}
    steps:
      - id: ref
        run: |
          ref="${{ inputs.ref || github.ref_name }}"
          echo "value=$ref" >> "$GITHUB_OUTPUT"
          safe="${ref//\//-}"
          echo "safe=$safe" >> "$GITHUB_OUTPUT"

  # ── Linux (uses fuse) ──────────────────────────────

  build-linux-amd64:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config
      - name: Install zig
        run: |
          curl -L "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" | sudo tar -xJ -C /usr/local
          echo "/usr/local/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"
      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild
      - name: Build
        run: |
          sh tools/docker/build-target.sh x86_64-unknown-linux-musl \
            "-C target-feature=+crt-static" \
            "" zigbuild
      - uses: actions/upload-artifact@v7
        with:
          name: mapache-linux-amd64
          path: target/x86_64-unknown-linux-musl/release/mapache

  build-linux-arm64:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config
      - name: Install zig
        run: |
          curl -L "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" | sudo tar -xJ -C /usr/local
          echo "/usr/local/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"
      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild
      - name: Build
        run: |
          sh tools/docker/build-target.sh aarch64-unknown-linux-musl \
            "-C target-feature=+crt-static" \
            "" zigbuild
      - uses: actions/upload-artifact@v7
        with:
          name: mapache-linux-arm64
          path: target/aarch64-unknown-linux-musl/release/mapache

  build-linux-armv7:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-musleabihf
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-linux-armv7
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config
      - name: Install zig
        run: |
          curl -L "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" | sudo tar -xJ -C /usr/local
          echo "/usr/local/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"
      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild
      - name: Build
        run: |
          sh tools/docker/build-target.sh armv7-unknown-linux-musleabihf \
            "-C target-feature=+crt-static" \
            "" zigbuild
      - uses: actions/upload-artifact@v7
        with:
          name: mapache-linux-armv7
          path: target/armv7-unknown-linux-musleabihf/release/mapache

  # ── Android (no fuse) ────────────────────────────

  build-android-arm64:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-android-arm64
      - name: Install Android NDK
        run: |
          curl -L https://dl.google.com/android/repository/android-ndk-r26d-linux.zip -o /tmp/ndk.zip
          unzip -q /tmp/ndk.zip -d /opt
          rm /tmp/ndk.zip
          echo "ANDROID_NDK_HOME=/opt/android-ndk-r26d" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=/opt/android-ndk-r26d/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=/opt/android-ndk-r26d/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=/opt/android-ndk-r26d/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang" >> "$GITHUB_ENV"
      - name: Build
        run: |
          sh tools/docker/build-target.sh aarch64-linux-android "" \
            "--no-default-features" build
      - uses: actions/upload-artifact@v7
        with:
          name: mapache-android-arm64
          path: target/aarch64-linux-android/release/mapache

  # ── Windows (no fuse) ────────────────────────────

  build-windows-amd64:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-windows-amd64
      - name: Install LLVM + cargo-xwin
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang llvm-dev
          rustup component add llvm-tools
          cargo install cargo-xwin
      - name: Build
        run: |
          sh tools/docker/build-target.sh x86_64-pc-windows-msvc \
            "-C target-feature=+crt-static" \
            "--features default" xwin
      - uses: actions/upload-artifact@v7
        with:
          name: mapache-windows-amd64
          path: target/x86_64-pc-windows-msvc/release/mapache.exe

  # ── macOS ──────────────────────────────────────────

  # NOTE: macOS binaries are NOT fully self-contained — Apple's system libraries
  # cannot be statically linked (system policy). These will depend on system dylibs.

  build-darwin-arm64:
    needs: setup
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.12"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-darwin-arm64
      - name: Install macFUSE
        run: |
          brew tap homebrew/cask
          brew install --cask macfuse
          pkg-config --exists osxfuse && echo "osxfuse found" || echo "osxfuse not found"
      - name: Build
        run: |
          sh tools/docker/build-target.sh aarch64-apple-darwin "" \
            "" build
      - uses: actions/upload-artifact@v7
        with:
          name: mapache-darwin-arm64
          path: target/aarch64-apple-darwin/release/mapache

  build-darwin-amd64:
    needs: setup
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.12"
      PKG_CONFIG_ALLOW_CROSS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-darwin-x86_64
      - name: Install macFUSE
        run: |
          brew tap homebrew/cask
          brew install --cask macfuse
          pkg-config --exists osxfuse && echo "osxfuse found" || echo "osxfuse not found"
      - name: Build
        run: |
          sh tools/docker/build-target.sh x86_64-apple-darwin "" \
            "" build
      - name: Verify binary
        run: |
          echo "=== Looking for binary ==="
          find target -name 'mapache' -type f 2>/dev/null
          echo "=== target dir ==="
          ls -la target/x86_64-apple-darwin/release/mapache 2>/dev/null || echo "NOT FOUND at expected path"
      - uses: actions/upload-artifact@v7
        with:
          name: mapache-darwin-amd64
          path: target/x86_64-apple-darwin/release/mapache

  # ── Package ────────────────────────────────────────

  package:
    needs:
      - setup
      - build-linux-amd64
      - build-linux-arm64
      - build-linux-armv7
      - build-android-arm64
      - build-windows-amd64
      - build-darwin-amd64
      - build-darwin-arm64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.ref }}

      - uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Package artifacts
        shell: bash
        run: |
          cd dist
          safe_ref="${{ needs.setup.outputs.safe_ref }}"

          # Collect raw binaries and compute checksums before compressing
          : > checksums.txt
          for dir in mapache-*; do
            [ -d "$dir" ] || continue
            binary=$(find "$dir" -type f | head -1)
            [ -z "$binary" ] && continue

            rest="${dir#mapache-}"
            platform="${rest%-*}"
            arch="${rest##*-}"
            ext=""
            case "$binary" in
              *.exe) ext=".exe" ;;
            esac

            name="mapache_${safe_ref}_${platform}_${arch}${ext}"
            mv "$binary" "$name"
            sha256sum "$name" >> checksums.txt
            rm -rf "$dir"
          done

          echo "Checksums:"
          cat checksums.txt

          # Compress
          for f in mapache_*; do
            [ -f "$f" ] || continue
            case "$f" in
              *.exe)          zip -m "${f%.exe}.zip" "$f" ;;
              *darwin*|*windows*) zip -m "${f}.zip" "$f" ;;
              *)              tar -cJf "${f}.tar.xz" "$f" && rm "$f" ;;
            esac
          done

          echo ""
          echo "Packaged artifacts:"
          ls -la

      - uses: actions/upload-artifact@v7
        with:
          name: mapache-packaged
          path: dist/*

      - name: Create draft release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          tag_name: ${{ needs.setup.outputs.ref }}
          name: ${{ needs.setup.outputs.ref }}
          files: dist/*
