name: Deploy docs

on:
  push:
    branches: [main]
    paths: [doc/**]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install mdBook
        run: |
          MDBOOK_VERSION="$(curl -fsSL https://api.github.com/repos/rust-lang/mdBook/releases/latest | jq -r '.tag_name' | tr -d 'v')"
          echo "Installing mdBook v${MDBOOK_VERSION}"
          curl -fsSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" -o mdbook.tar.gz
          tar -xzf mdbook.tar.gz
          sudo mv mdbook /usr/local/bin/mdbook
          mdbook --version

      - name: Build book
        run: mdbook build doc

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: doc/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
