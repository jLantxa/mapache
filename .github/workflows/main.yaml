name: main

on:
  push:
    branches: ["main"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: swatinem/rust-cache@v2
      - name: Check format
        run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # Keeps other OS tests running even if one fails
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: Set up FUSE (Linux)
        if: runner.os == 'Linux'
        run: |
          if ! command -v fusermount >/dev/null && ! command -v fusermount3 >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq fuse3
          fi
          if [ ! -e /dev/fuse ]; then
            sudo mknod /dev/fuse c 10 229
            sudo chmod 666 /dev/fuse
          fi

      - name: Test
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            cargo test --locked --verbose --no-default-features
          else
            cargo test --locked --verbose
          fi


