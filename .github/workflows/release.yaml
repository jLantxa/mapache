name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (tag, branch, or commit SHA)
        required: true
        type: string
      features:
        description: Features to enable
        required: false
        default: default
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Determine ref
        id: ref
        run: |
          ref="${{ inputs.ref || github.ref_name }}"
          if [ -z "$ref" ]; then
            echo "No ref provided. Push a tag or provide one manually."
            exit 1
          fi
          echo "value=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.value }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          load: true
          file: tools/docker/Dockerfile
          tags: mapache-builder:latest
          build-args: |
            BUILD_SOURCE=local
            GIT_REF=${{ steps.ref.outputs.value }}
            FEATURES=${{ inputs.features }}
            MAPACHE_RELEASE_BUILD=true
            CACHE_BREAKER=${{ github.run_id }}

      - name: Extract artifacts
        run: |
          docker create --name mapache-artifacts mapache-builder:latest
          mkdir -p artifacts
          docker cp mapache-artifacts:/artifacts/. artifacts/
          docker rm mapache-artifacts

      - name: Package artifacts
        shell: bash
        run: |
          cd artifacts
          safe_ref="${{ steps.ref.outputs.value }}"
          safe_ref="${safe_ref//\//-}"
          ls -la
          # mapache-{platform}-{arch}[.exe]
          for f in mapache-*; do
            [ -f "$f" ] || continue
            rest="${f#mapache-}"
            ext=""
            case "$rest" in
              *.exe) ext=".exe"; rest="${rest%.exe}" ;;
            esac
            platform="${rest%-*}"
            arch="${rest##*-}"
            case "$platform" in
              windows|darwin)
                mv "$f" "mapache${ext}"
                zip -m "mapache_${safe_ref}_${platform}_${arch}.zip" "mapache${ext}"
                ;;
              *)
                mv "$f" "mapache${ext}"
                tar -cJf "mapache_${safe_ref}_${platform}_${arch}.tar.xz" "mapache${ext}"
                rm "mapache${ext}"
                ;;
            esac
          done
          echo "Packaged artifacts:"
          ls -la

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ steps.ref.outputs.value }}
          name: ${{ steps.ref.outputs.value }}
          files: artifacts/*
