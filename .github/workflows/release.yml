name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build multi-platform binaries
        run: |
          docker build \
            --build-arg GIT_REF=${{ github.ref_name }} \
            --tag mapache-builder \
            --file Dockerfile .
          
          # Extract artifacts from the builder image
          docker create --name mapache-artifacts mapache-builder
          docker cp mapache-artifacts:/artifacts ./release_artifacts
          docker rm mapache-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release_artifacts/mapache_linux_x64
            release_artifacts/mapache_linux_arm64
            release_artifacts/mapache_linux_armv7
            release_artifacts/mapache_win_x64.exe
            release_artifacts/mapache_mac_x64
            release_artifacts/mapache_mac_arm64
          generate_release_notes: false
          draft: true
          body: "Release artifacts for ${{ github.ref_name }}. Please see CHANGELOG.md for details."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
