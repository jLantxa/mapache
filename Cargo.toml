[package]
name = "mapache"
version = "0.1.0-beta.4"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0"
repository = "https://github.com/jLantxa/mapache"
keywords = ["backup", "deduplication"]
readme = "README.md"

[dependencies]
aes-gcm-siv = "0.11.1"
anyhow = "1.0.100"
argon2 = "0.5.3"
base64 = "0.22.1"
blake3 = "1.8.2"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.51", features = ["derive", "wrap_help"] }
clap_complete = "4.5.60"
colored = "3.0.0"
crossbeam-channel = "0.5.15"
dialoguer = "0.12.0"
directories = "6.0.0"
fastcdc = "3.2.1"
filetime = "0.2.26"
hostname = "0.4.1"
indicatif = { version = "0.18.2", features = ["rayon"] }
libc = { version = "0.2.177"}
num_cpus = "1.17.0"
num_enum = "0.7.5"
parking_lot = "0.12.5"
rand = "0.9.2"
rayon = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
signal-hook = "0.3.18"
signal-hook-registry = "1.4.6"
ssh2 = { version = "0.9.5", features = ["vendored-openssl"] }
zstd = "0.13.3"

[target.'cfg(unix)'.dependencies]
fuser = {version = "0.16.0", optional = true}

[dev-dependencies]
rstest = "0.26.1"
tar = "0.4.44"
tempfile = "3.23.0"
xz2 = "0.1.7"

[features]
default = ["fuse"]
fuse = ["fuser"] #FUSE for mount command
