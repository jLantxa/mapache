[package]
name = "chunker-fuzz"
version = "0.1.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
chunker = { path = ".." }

[[bin]]
name = "chunker_stream"
path = "fuzz_targets/chunker_stream.rs"
test = false
doc = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }
