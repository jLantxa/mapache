[package]
name = "mapache"
version = "0.3.0-rc.1"
edition = "2024"
rust-version = "1.91"

[dependencies]
aes-gcm-siv = "0.11.1"
anyhow = "1.0.102"
argon2 = "0.5.3"
async-stream = "0.3.6"
async-trait = "0.1.89"
base64 = "0.22.1"
blake3 = "1.8.4"
chrono = { version = "0.4.44", features = ["serde"] }
chunker = { path = "../chunker" }
clap = { version = "4.6.1", features = ["derive", "wrap_help", "env"] }
clap_complete = "4.6.2"
colored = "3.1.1"
crossbeam-channel = "0.5.15"
dialoguer = "0.12.0"
directories = "6.0.0"
filetime = "0.2.27"
futures = "0.3.32"
hostname = "0.4.2"
indicatif = { version = "0.18.4", features = ["rayon"] }
libc = { version = "0.2.185" }
num_cpus = "1.17.0"
num_enum = "0.7.6"
parking_lot = "0.12.5"
rand = "0.10.1"
rayon = "1.12.0"
rust-s3 = { version = "0.37.1", default-features = false, features = ["reqwest", "with-tokio"] }
rustc-hash = "2.1.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
signal-hook-registry = "1.4.8"
russh = { version = "0.60.1", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-sftp = "2.1.1"
# Force ring for rustls and reqwest to avoid aws-lc-sys issues on macOS cross-compilation
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots", "json", "stream"] }
tokio = { version = "1.52", features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "net",
  "io-util",
  "time",
] }
tokio-stream = "0.1.18"
zstd = "0.13.3"
url = "2.5.8"
percent-encoding = "2.3.2"
thiserror = "2.0.18"

[target.'cfg(unix)'.dependencies]
xattr = "1.6.1"
fuser = { version = "0.17.0", optional = true, default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = "0.6.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
scopeguard = "1.2.0"
rstest = "0.26.1"
tar = "0.4.45"
tempfile = "3.27.0"
xz2 = "0.1.7"

[features]
default = ["fuse"]
fuse = ["fuser"]   #FUSE for mount command
