[package]
name = "mapache"
version = "0.2.2"
edition = "2024"
rust-version = "1.91"

[dependencies]
aes-gcm-siv = "0.11.1"
anyhow = "1.0.102"
argon2 = "0.5.3"
async-stream = "0.3.6"
async-trait = "0.1.89"
base64 = "0.22.1"
blake3 = "1.8.3"
chrono = { version = "0.4.44", features = ["serde"] }
chunker = { path = "../chunker" }
clap = { version = "4.6.0", features = ["derive", "wrap_help"] }
clap_complete = "4.6.0"
colored = "3.1.1"
crossbeam-channel = "0.5.15"
dialoguer = "0.12.0"
directories = "6.0.0"
filetime = "0.2.27"
futures = "0.3.32"
hostname = "0.4.2"
httpdate = "1.0.3"
indicatif = { version = "0.18.4", features = ["rayon"] }
libc = { version = "0.2.183" }
num_cpus = "1.17.0"
num_enum = "0.7.6"
parking_lot = "0.12.5"
rand = "0.9.2"
rayon = "1.11.0"
rust-s3 = "0.37.1"
rustc-hash = "2.1.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
signal-hook = "0.4.3"
signal-hook-registry = "1.4.8"
russh = "0.58.0"
russh-keys = "0.49.2"
russh-sftp = "2.1.1"
threadpool = "1.8.1"
tokio = { version = "1.50", features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "net",
  "io-util",
  "time",
] }
tokio-stream = "0.1.18"
zstd = "0.13.3"
url = "2.5.8"
percent-encoding = "2.3.2"

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.17.0", optional = true }
tikv-jemallocator = "0.6.1"

[dev-dependencies]
scopeguard = "1.2.0"
rstest = "0.26.1"
tar = "0.4.45"
tempfile = "3.27.0"
xz2 = "0.1.7"

[features]
default = ["fuse"]
fuse = ["fuser"]   #FUSE for mount command
