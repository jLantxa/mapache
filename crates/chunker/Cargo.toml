[package]
name = "mapache-chunker"
version = "0.3.0"
edition = "2024"
description = "FastCDC (Fast Content-Defined Chunking) implementation"
repository.workspace = true
license = "GPL-3.0-only"
readme = "README.md"
keywords = ["fastcdc", "chunking", "deduplication", "content-defined", "cdc"]
categories = ["algorithms", "filesystem"]

[lints]
workspace = true

[[bin]]
name = "chunker-lookup"
path = "src/bin/lookup_gen.rs"

[dependencies]
blake3 = "1.8"
rand = "0.10"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
rstest = "0.26"

[[bench]]
name = "chunking"
harness = false
