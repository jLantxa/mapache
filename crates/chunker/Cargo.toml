[package]
name = "mapache-chunker"
version = "0.3.1"
edition = "2024"
description = "FastCDC (Fast Content-Defined Chunking) implementation"
repository.workspace = true
documentation.workspace = true
license = "GPL-3.0-only"
readme = "README.md"
keywords = ["fastcdc", "chunking", "deduplication", "content-defined", "cdc"]
categories = ["algorithms", "filesystem"]

[lints]
workspace = true

[[example]]
name = "chunker-lookup"
path = "examples/lookup_gen.rs"

[dev-dependencies]
blake3 = "1.8"
criterion = { version = "0.8", features = ["html_reports"] }
rand = "0.10"
rstest = "0.29"

[[bench]]
name = "chunking"
harness = false
