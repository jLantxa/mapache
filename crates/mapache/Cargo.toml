[package]
name = "mapache"
version = "0.7.1"
edition = "2024"
rust-version = "1.96.0"
description = "Fast, secure, deduplicating, incremental backup tool"
license = "GPL-3.0-only"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "../../README.md"
keywords = ["backup", "deduplication", "incremental", "encryption", "s3"]
categories = ["command-line-utilities", "filesystem"]

[lints]
workspace = true

[dependencies]
aes-gcm-siv = "0.12"
argon2 = "0.6"
async-stream = "0.3"
async-trait = "0.1"
blake3 = "1.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive", "wrap_help", "env"] }
clap_complete = "4.6"
crossbeam-channel = "0.5"
crossterm = "0.29"
futures = "0.3"
indicatif = "0.18"
libc = { version = "0.2" }
mapache-chunker = { version = "0.3.1", path = "../chunker" }
parking_lot = "0.13"
percent-encoding = "2.3"
rand = "0.10"
ratatui = "0.30"
rayon = "1.12"
russh = { version = "0.64", default-features = false, features = [
  "flate2",
  "ring",
] }
russh-sftp = "3.0"
rust-s3 = { version = "0.38", default-features = false, features = [
  "with-tokio",
  "tokio-rustls-tls-ring",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.54", features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "net",
  "io-util",
  "sync",
  "time",
  "signal",
  "process",
] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
unicode-width = "0.2"
url = "2.5"
zeroize = { version = "1.9", features = ["derive"] }
zstd = "0.14"

[target.'cfg(unix)'.dependencies]
fuser = { version = "0.18", optional = true, default-features = false }
xattr = "1.6"

[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = "0.7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_System_Pipes",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }

[dev-dependencies]
anyhow = "1.0"
flate2 = "1"
hyper-util = { version = "0.1", features = ["server-auto", "http1", "tokio"] }
proptest = "1.12"
rstest = "0.28"
# In-process S3 server used by the backend conformance tests (`s3s` + `s3s-fs`,
# served with `hyper-util`). Never shipped.
s3s = "0.17"
s3s-fs = "0.17"
scopeguard = "1.2"
serial_test = "4.0"
tar = "0.4"
tempfile = "3.27"

[features]
default = ["mount"]
mount = ["fuser"]   #FUSE for mount command on unix
