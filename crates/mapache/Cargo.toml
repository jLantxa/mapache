[package]
name = "mapache"
version = "0.5.2"
edition = "2024"
rust-version = "1.91"
description = "Fast, secure, deduplicating, incremental backup tool"
license = "GPL-3.0-only"
repository.workspace = true

[lints]
workspace = true

[dependencies]
aes-gcm-siv = "0.11.1"
argon2 = "0.5.3"
async-stream = "0.3.6"
async-trait = "0.1.89"
blake3 = "1.8.5"
chrono = { version = "0.4.45", features = ["serde"] }
chunker = { path = "../chunker" }
clap = { version = "4.6.1", features = ["derive", "wrap_help", "env"] }
clap_complete = "4.6.7"
crossbeam-channel = "0.5.16"
crossterm = "0.29"
dashmap = "6.2.1"
futures = "0.3.32"
indicatif = "0.18.6"
libc = { version = "0.2.186" }
parking_lot = "0.12.5"
percent-encoding = "2.3"
rand = "0.10.2"
ratatui = "0.30.2"
rayon = "1.12.0"
russh = { version = "0.62.2", default-features = false, features = [
  "flate2",
  "ring",
] }
russh-sftp = "2.3.0"
rust-s3 = { version = "0.37.2", default-features = false, features = [
  "with-tokio",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52", features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "net",
  "io-util",
  "sync",
  "time",
  "signal",
  "process",
] }
tokio-stream = "0.1.18"
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt"] }
url = "2.5.8"
zeroize = { version = "1.9.0", features = ["derive"] }
zstd = "0.13.3"

[target.'cfg(unix)'.dependencies]
fuser = { version = "0.17.0", optional = true, default-features = false }
xattr = "1.6.1"

[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = "0.7.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Pipes",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }

[dev-dependencies]
anyhow = "1.0.103"
rstest = "0.26.1"
scopeguard = "1.2.0"
tempfile = "3.27.0"

[features]
default = ["mount"]
mount = ["fuser"]                      #FUSE for mount command on unix
