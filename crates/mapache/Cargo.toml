[package]
name = "mapache"
version = "0.6.0"
edition = "2024"
rust-version = "1.93.1"
description = "Fast, secure, deduplicating, incremental backup tool"
license = "GPL-3.0-only"
repository.workspace = true
readme = "../../README.md"
keywords = ["backup", "deduplication", "incremental", "encryption", "s3"]
categories = ["command-line-utilities", "filesystem"]

[lints]
workspace = true

[dependencies]
aes-gcm-siv = "0.12"
argon2 = "0.6"
async-stream = "0.3"
async-trait = "0.1"
blake3 = "1.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive", "wrap_help", "env"] }
clap_complete = "4.6"
crossbeam-channel = "0.5"
crossterm = "0.29"
futures = "0.3"
indicatif = "0.18"
libc = { version = "0.2" }
mapache-chunker = { version = "0.3.0", path = "../chunker" }
parking_lot = "0.12"
percent-encoding = "2.3"
rand = "0.10"
ratatui = "0.30"
rayon = "1.12"
russh = { version = "0.63", default-features = false, features = [
  "flate2",
  "ring",
] }
russh-sftp = "2.4"
rust-s3 = { version = "0.37", default-features = false, features = [
  "with-tokio",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.53", features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "net",
  "io-util",
  "sync",
  "time",
  "signal",
  "process",
] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
url = "2.5"
zeroize = { version = "1.9", features = ["derive"] }
zstd = "0.13"

[target.'cfg(unix)'.dependencies]
fuser = { version = "0.18", optional = true, default-features = false }
xattr = "1.6"

[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = "0.7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Pipes",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }

[dev-dependencies]
anyhow = "1.0"
proptest = "1.11"
rstest = "0.26"
scopeguard = "1.2"
serial_test = "4.0"
tempfile = "3.27"

[features]
default = ["mount"]
mount = ["fuser"]   #FUSE for mount command on unix
