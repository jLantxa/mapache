[graph]
all-features = true
no-default-features = false

[output]
feature-depth = 1

[advisories]
# Temporary: mapache itself no longer depends on chrono. The remaining edges
# are unreleased upstream fixes:
# - russh-sftp PR #116 (chrono -> jiff), merged but not published
# - s3s / s3s-fs PR #867 (removes unused chrono), merged but not published
# - russh-util 0.52.0 has a wasm32-only chrono edge with no released fix
# Remove this ignore once released versions of all three are chrono-free.
ignore = [
  { id = "RUSTSEC-2026-0543", reason = "Only transitive through upstream crates with unreleased fixes; remove after russh-sftp, s3s/s3s-fs, and russh-util releases land." },
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Unicode-3.0",
  "GPL-3.0-only",
  "ISC",
  "NCSA",
  "Zlib",
  "CC0-1.0",
  # GPLv3-compatible: MPL-2.0 (file-level copyleft, via attohttpc) and
  # CDLA-Permissive-2.0 (permissive data license, via webpki-roots) are both
  # pulled in by rust-s3's TLS support (tokio-rustls-tls-ring).
  "MPL-2.0",
  "CDLA-Permissive-2.0",
] # Trimmed to exactly the licenses the current dependency graph requires.
# Each entry is load-bearing: removing any one makes `cargo deny check licenses`
# fail. `unused-allowed-license = "deny"` keeps it that way.
confidence-threshold = 0.8
unused-allowed-license = "deny"
exceptions = []

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
allow-workspace = false
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
