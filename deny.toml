[graph]
all-features = true
no-default-features = false

[output]
feature-depth = 1

[advisories]
# rust-s3 is pinned to a fork (Charles-Johnson/rust-s3 rev 8f2785af) that
# resolves quick-xml to 0.41.0, patching RUSTSEC-2026-0194 (quadratic CPU in
# attribute duplicate-name check) and RUSTSEC-2026-0195 (unbounded NsReader
# namespace allocation). No advisories are ignored.
ignore = [
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "GPL-3.0-only",
    "ISC",
    "NCSA",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
allow-workspace = false
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# rust-s3 fork until upstream's quick-xml advisories are addressed upstream.
allow-git = ["https://github.com/Charles-Johnson/rust-s3"]

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
