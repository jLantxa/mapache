[graph]
all-features = true
no-default-features = false

[output]
feature-depth = 1

[advisories]
# quick-xml v0.38.4 (via rust-s3 v0.37.2) — upstream has no fix yet.
# RUSTSEC-2026-0194: Quadratic CPU exhaustion in attribute duplicate-name check.
# RUSTSEC-2026-0195: Unbounded namespace allocation in NsReader (OOM).
# Both are High severity DoS requiring crafted XML input from a remote source.
# mapache does not use NsReader and does not call attributes() with default
# checks on untrusted input, so the practical risk is minimal.
ignore = [
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "GPL-3.0-only",
    "ISC",
    "MPL-2.0",
    "NCSA",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
allow-workspace = false
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
